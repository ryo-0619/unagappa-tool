<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>会計アプリ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <h1>会計アプリ</h1>
  <div class="tab-menu">
    <button class="tab-btn active" data-tab="members-tab">メンバー</button>
    <button class="tab-btn" data-tab="payment-tab">支払い</button>
    <button class="tab-btn" data-tab="refund-tab">返金</button>
    <button class="tab-btn" data-tab="history-tab">履歴</button>
    <button class="tab-btn" data-tab="balance-tab">建替/負債</button>
    <button class="tab-btn" data-tab="settlement-tab">精算</button>
  </div>
</header>

<main class="container">

  <!-- ここに UI（あなたの元の HTML）をそのまま配置 -->
  <!-- ※あなたの UI は壊れていなかったのでそのまま残しています -->

  <!-- タブ1: メンバー管理 -->
  <section id="members-tab" class="tab-content active">
    <h2>メンバー</h2>
    <div id="memberList" class="member-list"></div>

    <div class="form-group" style="margin-top: 20px;">
      <label for="newMemberName">メンバー追加</label>
      <input id="newMemberName" type="text" placeholder="名前">
    </div>
    <button class="btn" id="addMemberBtn">追加</button>
    <button class="btn" id="editMemberBtn" style="background-color: #2196F3; margin-left: 10px;">編集</button>
    <button class="btn" id="deleteSelectedBtn" style="background-color: #f44336; margin-left: 10px; display:none;">削除</button>
    <button class="btn" id="cancelEditBtn" style="background-color: #999; margin-left: 10px; display:none;">キャンセル</button>
  </section>

  <!-- タブ2: 支払い登録 -->
  <section id="payment-tab" class="tab-content">
    <h2>支払い登録</h2>

    <div class="form-group">
      <label>支払い内容</label>
      <input id="payTitle" type="text">
    </div>

    <div class="form-group">
      <label>支払日</label>
      <input id="payDate" type="date">
    </div>

    <div class="form-group">
      <label>立替者（複数選択可）</label>
      <div id="payerList" class="member-list"></div>
    </div>

    <div id="payerAmounts"></div>

    <div class="form-group">
      <label>債務者（複数選択可）</label>
      <div id="receiverList" class="member-list"></div>
    </div>

    <div id="receiverAmounts"></div>

    <button class="btn" id="splitButton">割り勘計算</button>

    <h3>確認</h3>
    <div id="confirmArea"></div>

    <button class="btn" id="registerPaymentBtn">支払い登録</button>
  </section>

  <!-- タブ3: 返金登録 -->
  <section id="refund-tab" class="tab-content">
    <h2>返金登録</h2>

    <div class="form-group">
      <label>支払者</label>
      <select id="refundFrom"></select>
    </div>

    <div class="form-group">
      <label>受取者</label>
      <select id="refundTo"></select>
    </div>

    <div class="form-group">
      <label>金額</label>
      <input id="refundAmount" type="number" min="0">
    </div>

    <div class="form-group">
      <label>メモ</label>
      <input id="refundMemo" type="text">
    </div>

    <button class="btn" id="registerRefundBtn">返金登録</button>
  </section>

  <!-- タブ4: 履歴 -->
  <section id="history-tab" class="tab-content">
    <h2>履歴</h2>
    <h3>支払い履歴</h3>
    <table class="table" id="paymentHistoryTable"></table>

    <h3>返金履歴</h3>
    <table class="table" id="refundHistoryTable"></table>
  </section>

  <!-- タブ5: 建替/負債一覧 -->
  <section id="balance-tab" class="tab-content">
    <h2>建替 / 負債一覧</h2>
    <table class="table" id="balanceTable"></table>
  </section>

  <!-- タブ6: 精算ページ -->
  <section id="settlement-tab" class="tab-content">
    <h2>精算提案</h2>
    <div id="settlementList"></div>
    <button class="btn" id="settlementExecuteBtn">選択した支払いを完了</button>
  </section>

</main>

<!-- JS は main の外に置く（これが重要） -->
<script src="gas_code.js"></script>

</script>

</body>
</html>
